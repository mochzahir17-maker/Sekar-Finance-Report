<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sekaruang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // === KONFIGURASI ===
        // TEMPELKAN URL GOOGLE SCRIPT ANDA DI BAWAH INI:
        const SCRIPT_URL = "URL_GOOGLE_SCRIPT_ANDA_DI_SINI";

        function App() {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('dashboard');
            const [formData, setFormData] = useState({ jenis: 'Pemasukan', kategori: 'Penjualan', jumlah: '', keterangan: '', tanggal: new Date().toISOString().split('T')[0] });

            useEffect(() => { fetchData(); }, []);

            const fetchData = async () => {
                try {
                    const resp = await fetch(SCRIPT_URL);
                    const json = await resp.json();
                    // SORTIR OTOMATIS: Tanggal terbaru di atas
                    const sortedData = json.data.sort((a, b) => new Date(b.Tanggal) - new Date(a.Tanggal));
                    setData(sortedData);
                    setLoading(false);
                } catch (e) { alert("Gagal ambil data"); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(formData)
                    });
                    setFormData({ ...formData, jumlah: '', keterangan: '' });
                    await fetchData();
                    setView('dashboard');
                } catch (e) { alert("Gagal simpan"); setLoading(false); }
            };

            const stats = useMemo(() => {
                return data.reduce((acc, curr) => {
                    const nominal = parseFloat(curr.Jumlah) || 0;
                    if (curr.Jenis === 'Pemasukan') acc.masuk += nominal;
                    else acc.keluar += nominal;
                    return acc;
                }, { masuk: 0, keluar: 0 });
            }, [data]);

            if (loading && data.length === 0) return <div className="flex h-screen items-center justify-center">Memuat...</div>;

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-20">
                    {/* Header */}
                    <div className="p-6 bg-emerald-600 text-white shadow-md">
                        <h1 className="text-xl font-bold">Sekaruang</h1>
                        <p className="text-emerald-100 text-sm">Kelola keuangan jadi mudah</p>
                    </div>

                    {view === 'dashboard' ? (
                        <div className="p-4 space-y-6">
                            {/* Ringkasan */}
                            <div className="grid grid-cols-2 gap-4">
                                <div className="p-4 bg-emerald-50 rounded-2xl border border-emerald-100">
                                    <p className="text-xs text-emerald-600 font-medium">Pemasukan</p>
                                    <p className="text-lg font-bold text-emerald-700">Rp {stats.masuk.toLocaleString()}</p>
                                </div>
                                <div className="p-4 bg-rose-50 rounded-2xl border border-rose-100">
                                    <p className="text-xs text-rose-600 font-medium">Pengeluaran</p>
                                    <p className="text-lg font-bold text-rose-700">Rp {stats.keluar.toLocaleString()}</p>
                                </div>
                            </div>

                            {/* List Transaksi - Terurut dari yang terbaru */}
                            <div>
                                <h3 className="font-bold mb-3 text-slate-700 px-1">Riwayat Terbaru</h3>
                                <div className="space-y-3">
                                    {data.map((item, i) => (
                                        <div key={i} className="flex justify-between items-center p-4 bg-slate-50 rounded-xl border border-slate-100">
                                            <div>
                                                <p className="font-semibold text-slate-800">{item.Keterangan || item.Kategori}</p>
                                                <p className="text-[10px] text-slate-400 uppercase tracking-wider">{new Date(item.Tanggal).toLocaleDateString('id-ID', {day:'numeric', month:'short'})} • {item.Kategori}</p>
                                            </div>
                                            <p className={`font-bold ${item.Jenis === 'Pemasukan' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                {item.Jenis === 'Pemasukan' ? '+' : '-'} {parseFloat(item.Jumlah).toLocaleString()}
                                            </p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            <h2 className="text-xl font-bold text-slate-800 mb-4">Tambah Catatan</h2>
                            
                            <div>
                                <label className="text-xs font-bold text-slate-500 uppercase">Tipe</label>
                                <select className="w-full p-3 mt-1 bg-slate-100 rounded-xl border-none focus:ring-2 focus:ring-emerald-500" 
                                    value={formData.jenis} onChange={e => setFormData({...formData, jenis: e.target.value, kategori: e.target.value === 'Pemasukan' ? 'Penjualan' : ''})}>
                                    <option value="Pemasukan">Pemasukan (+)</option>
                                    <option value="Pengeluaran">Pengeluaran (-)</option>
                                </select>
                            </div>

                            {formData.jenis === 'Pemasukan' ? (
                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase">Kategori</label>
                                    <select className="w-full p-3 mt-1 bg-slate-100 rounded-xl border-none focus:ring-2 focus:ring-emerald-500" 
                                        value={formData.kategori} onChange={e => setFormData({...formData, kategori: e.target.value})}>
                                        <option value="Penjualan">Penjualan</option>
                                    </select>
                                </div>
                            ) : (
                                <div>
                                    <label className="text-xs font-bold text-slate-500 uppercase">Kategori Pengeluaran</label>
                                    <input className="w-full p-3 mt-1 bg-slate-100 rounded-xl border-none focus:ring-2 focus:ring-emerald-500" 
                                        type="text" placeholder="Misal: Listrik, Gaji" required
                                        value={formData.kategori} onChange={e => setFormData({...formData, kategori: e.target.value})} />
                                </div>
                            )}

                            <div>
                                <label className="text-xs font-bold text-slate-500 uppercase">Nominal (Rp)</label>
                                <input className="w-full p-3 mt-1 bg-slate-100 rounded-xl border-none focus:ring-2 focus:ring-emerald-500" 
                                    type="number" placeholder="0" required
                                    value={formData.jumlah} onChange={e => setFormData({...formData, jumlah: e.target.value})} />
                            </div>

                            <div>
                                <label className="text-xs font-bold text-slate-500 uppercase">Catatan</label>
                                <input className="w-full p-3 mt-1 bg-slate-100 rounded-xl border-none focus:ring-2 focus:ring-emerald-500" 
                                    type="text" placeholder="Keterangan tambahan"
                                    value={formData.keterangan} onChange={e => setFormData({...formData, keterangan: e.target.value})} />
                            </div>

                            <button type="submit" disabled={loading} className="w-full p-4 bg-emerald-600 text-white rounded-2xl font-bold shadow-lg shadow-emerald-200 active:scale-95 transition-all">
                                {loading ? 'Memproses...' : 'Simpan Transaksi'}
                            </button>
                            <button type="button" onClick={() => setView('dashboard')} className="w-full p-2 text-slate-400 text-sm">Batal</button>
                        </form>
                    )}

                    {/* Navigasi Bawah */}
                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 backdrop-blur-md border-t border-slate-100 flex justify-around p-3">
                        <button onClick={() => setView('dashboard')} className={`p-2 px-6 rounded-xl transition-all ${view === 'dashboard' ? 'bg-emerald-100 text-emerald-700' : 'text-slate-400'}`}>
                            🏠 Dashboard
                        </button>
                        <button onClick={() => setView('form')} className="p-2 px-6 bg-emerald-600 text-white rounded-xl shadow-md font-bold">
                            + Tambah
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
